<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">

        <title>Todos</title>
        <link

            <div class="row">
                <div class="col-md-6 mb-4">
					<div class="card">
						<div class="card-body">
							<form id="todoForm">

									<label for="todoItem">Todo Item</label>
									<input type="text" class="form-control" id="todoItem" />

								<button type="submit" id="addTodoBtn" class="btn btn-primary btn-block btn-sm">

								</button>

                                <button type="button" id="updateTodoBtn" class="d-none btn btn-primary btn-block btn-sm">

								</button>

							</form>
						</div>
					</div>
				</div>





				<div class="col-md-6">
				    <ul class="list-group" id="todoList">

						</li> -->
